  [W, D, D, D, D, D, D, D, D, D, D, D, D, W, W, D, D, D, D, D, D, D, D, D, D, D, D, W], //20

  [W, W, W, D, W, W, D, W, W, D, W, W, W, W, W, W, W, W, D, W, W, D, W, W, D, W, W, W], //25
  [W, D, D, D, D, D, D, W, W, D, D, D, D, W, W, D, D, D, D, W, W, D, D, D, D, D, D, W], //26
  [W, D, W, W, W, W, W, W, W, W, W, W, D, W, W, D, W, W, W, W, W, W, W, W, W, W, D, W], //27
  [W, D, W, W, W, W, W, W, W, W, W, W, D, W, W, D, W, W, W, W, W, W, W, W, W, W, D, W], //28

];

// Fruit table
const FRUIT_TABLE = [
  {name:'cherry',pts:100,color:'#FF0000'},
  {name:'strawberry',pts:300,color:'#FF3366'},
  {name:'orange',pts:500,color:'#FFB852'},
  {name:'orange',pts:500,color:'#FFB852'},
  {name:'apple',pts:700,color:'#FF0000'},
  {name:'apple',pts:700,color:'#FF0000'},
  {name:'melon',pts:1000,color:'#00FF00'},
  {name:'melon',pts:1000,color:'#00FF00'},
  {name:'galaxian',pts:2000,color:'#0066FF'},
  {name:'galaxian',pts:2000,color:'#0066FF'},
  {name:'bell',pts:3000,color:'#FFE000'},
  {name:'bell',pts:3000,color:'#FFE000'},
  {name:'key',pts:5000,color:'#FFFFFF'},
];

// Ghost scatter/chase timing per level type
const MODE_TIMINGS = {
  1: [7,20,7,20,5,20,5,Infinity],
  2: [7,20,7,20,5,1033,1/60,Infinity],
  5: [5,20,5,20,5,1037,1/60,Infinity],
};

// Speed tables (fraction of base speed)
const SPEED_TABLE = {
  1:  {pac:0.80,pacFright:0.90,ghost:0.75,ghostFright:0.50,ghostTunnel:0.40},
  2:  {pac:0.90,pacFright:0.95,ghost:0.85,ghostFright:0.55,ghostTunnel:0.45},
  5:  {pac:1.00,pacFright:1.00,ghost:0.95,ghostFright:0.60,ghostTunnel:0.50},
  21: {pac:0.90,pacFright:0.90,ghost:0.95,ghostFright:0.60,ghostTunnel:0.50},
};

// Fright durations per level
const FRIGHT_TIMES = [6,5,4,3,2,5,5,5,1,1,1,3,3,3,1,1,0,0,0,0,0];

function getSpeedForLevel(lvl) {
  if (lvl >= 21) return SPEED_TABLE[21];
  if (lvl >= 5) return SPEED_TABLE[5];
  if (lvl >= 2) return SPEED_TABLE[2];
  return SPEED_TABLE[1];
}

function getFrightTime(lvl) {
  const idx = Math.min(lvl - 1, FRIGHT_TIMES.length - 1);
  return FRIGHT_TIMES[idx];
}

function getModeTimings(lvl) {
  if (lvl >= 5) return MODE_TIMINGS[5];
  if (lvl >= 2) return MODE_TIMINGS[2];
  return MODE_TIMINGS[1];
}

function getElroyThresholds(lvl) {
  const base1 = lvl === 1 ? 20 : lvl <= 4 ? 30 : 40;
  const base2 = lvl === 1 ? 10 : lvl <= 4 ? 15 : 20;
  return {elroy1: base1, elroy2: base2};
}

// ─── GLOBALS ────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let maze = [];
let totalDots = 0;
let dotsEaten = 0;
let score = 0;
let highScore = 0;
let lives = 3;
let level = 1;
let difficulty = 'normal';
let gameState = 'title'; // title, ready, playing, dying, levelComplete, gameOver
let stateTimer = 0;
let ghostEatCombo = 0;
let extraLifeGiven = false;
let fruitActive = false;
let fruitTimer = 0;
let fruitSpawned = 0;
let soundEnabled = true;
let paused = false;

// Mode management
let modeIndex = 0;
let modeTimer = 0;
let currentMode = 'scatter'; // scatter, chase, frightened
let frightTimer = 0;
let frightFlashing = false;

// Entities
let pacman, ghosts;

// Particles
const particles = [];
const scorePopups = [];

// Screen shake
let shakeTimer = 0;
let shakeIntensity = 0;

// Level complete animation
let levelFlashTimer = 0;
let levelFlashCount = 0;

// ─── AUDIO ENGINE ───────────────────────────────────────────
let audioCtx = null;
let sirenOsc = null, sirenGain = null;
let frightOsc = null, frightGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, dur, type, vol, detune) {
  if (!audioCtx || !soundEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  if (detune) osc.detune.value = detune;
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playWaka() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.linearRampToValueAtTime(400, t + 0.04);
  osc.frequency.linearRampToValueAtTime(200, t + 0.08);
  gain.gain.setValueAtTime(0.12, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.1);
}

function playPowerEat() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(600, t);
  osc.frequency.exponentialRampToValueAtTime(100, t + 0.4);
  gain.gain.setValueAtTime(0.12, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.4);
}

function playGhostEat() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(1200, t + 0.3);
  gain.gain.setValueAtTime(0.15, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.35);
}

function playDeath() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  for (let i = 0; i < 12; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 600 - i * 40;
    gain.gain.setValueAtTime(0.12, t + i * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.12);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t + i * 0.12);
    osc.stop(t + i * 0.12 + 0.13);
  }
}

function playLevelComplete() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const notes = [523,659,784,1047,784,1047];
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.1, t + i * 0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t + i * 0.15);
    osc.stop(t + i * 0.15 + 0.16);
  });
}

function playExtraLife() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  [523,659,784,1047,1319].forEach((f,i)=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type='triangle'; osc.frequency.value=f;
    gain.gain.setValueAtTime(0.12,t+i*0.1);
    gain.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t+i*0.1);osc.stop(t+i*0.1+0.16);
  });
}

function playFruitEat() {
  if (!audioCtx || !soundEnabled) return;

    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t+i*0.06);osc.stop(t+i*0.06+0.11);
  });
}

function playIntro() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const melody = [262,330,392,523,392,330,262,330,392,523,659,523,392,523];
  melody.forEach((f,i)=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type='square'; osc.frequency.value=f;
    gain.gain.setValueAtTime(0.08,t+i*0.14);
    gain.gain.exponentialRampToValueAtTime(0.001,t+i*0.14+0.14);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t+i*0.14);osc.stop(t+i*0.14+0.15);

}

function startSiren() {
  if (!audioCtx || !soundEnabled || sirenOsc) return;
  sirenOsc = audioCtx.createOscillator();
  sirenGain = audioCtx.createGain();
  sirenOsc.type = 'sine';
  sirenOsc.frequency.value = 100;
  sirenGain.gain.value = 0.04;
  sirenOsc.connect(sirenGain).connect(audioCtx.destination);
  sirenOsc.start();
}

function updateSiren() {
  if (!sirenOsc) return;
  if (currentMode === 'frightened') {
    sirenGain.gain.value = 0;
    return;
  }
  sirenGain.gain.value = soundEnabled ? 0.04 : 0;
  const progress = dotsEaten / Math.max(1, totalDots);
  sirenOsc.frequency.value = 100 + progress * 150;
}

function stopSiren() {
  if (sirenOsc) { sirenOsc.stop(); sirenOsc = null; sirenGain = null; }
}

function startFrightSound() {
  if (!audioCtx || !soundEnabled || frightOsc) return;
  frightOsc = audioCtx.createOscillator();
  frightGain = audioCtx.createGain();
  frightOsc.type = 'sine';
  frightOsc.frequency.value = 60;
  frightGain.gain.value = 0.06;
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 8;
  lfoGain.gain.value = 30;
  lfo.connect(lfoGain).connect(frightOsc.frequency);
  lfo.start();
  frightOsc.connect(frightGain).connect(audioCtx.destination);
  frightOsc.start();
  frightOsc._lfo = lfo;
}

function stopFrightSound() {
  if (frightOsc) { frightOsc._lfo.stop(); frightOsc.stop(); frightOsc = null; frightGain = null; }
}

// ─── MAZE HELPERS ───────────────────────────────────────────
function resetMaze() {
  maze = MAZE_TEMPLATE.map(r => [...r]);
  totalDots = 0;
  dotsEaten = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (maze[r][c] === D || maze[r][c] === P) totalDots++;
}

function isWall(col, row) {
  if (row < 0 || row >= ROWS) return true;
  // Tunnel wrap
  if (col < 0 || col >= COLS) return false;
  const t = maze[row][col];
  return t === W;
}

function isGhostHouse(col, row) {
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
  return maze[row][col] === G || maze[row][col] === GD;
}

function canMove(col, row, isGhost, isEyes) {
  if (row < 0 || row >= ROWS) return true;
  if (col < 0 || col >= COLS) return true; // tunnel
  const t = maze[row][col];
  if (t === W) return false;
  if (t === GD) return isGhost;
  if (t === G) return isEyes || isGhost;
  return true;
}

function isTunnel(col) {
  return col < 6 || col >= 22;
}

function wrapCol(c) {
  if (c < 0) return COLS - 1;
  if (c >= COLS) return 0;
  return c;
}

// ─── DIRECTIONS ─────────────────────────────────────────────
const DIR = {
  left:  {x:-1,y:0},
  right: {x:1, y:0},
  up:    {x:0, y:-1},
  down:  {x:0, y:1},
  none:  {x:0, y:0}
};
const OPPOSITE = {left:'right',right:'left',up:'down',down:'up',none:'none'};
const DIR_ORDER = ['up','left','down','right']; // priority for ghost AI

// ─── DIFFICULTY MODIFIERS ───────────────────────────────────
function getDiffMod() {
  if (difficulty === 'easy') return {ghostSpeed:0.85, frightMult:1.5, elroyMult:0.7, pacSpeed:1.0};
  if (difficulty === 'hard') return {ghostSpeed:1.15, frightMult:0.6, elroyMult:1.5, pacSpeed:1.0};
  return {ghostSpeed:1.0, frightMult:1.0, elroyMult:1.0, pacSpeed:1.0};
}

document.addEventListener('keydown', e => {

  if (e.code === 'ArrowRight' || e.code === 'KeyD') pacman.nextDir = 'right';
  if (e.code === 'ArrowUp' || e.code === 'KeyW') pacman.nextDir = 'up';
  if (e.code === 'ArrowDown' || e.code === 'KeyS') pacman.nextDir = 'down';
});

// Touch
document.addEventListener('touchstart', e => {
  if (gameState === 'title') { startGame(); return; }
  if (gameState === 'gameOver') { resetToTitle(); return; }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {

  const dy = e.changedTouches[0].clientY - touchStartY;

// ─── GAME STATE MANAGEMENT ──────────────────────────────────
function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('gameOverScreen').classList.remove('active');
  score = 0;
  lives = 3;
  level = 1;
  extraLifeGiven = false;
  resetLevel();
  gameState = 'ready';
  stateTimer = 2.5;
  playIntro();
}

function resetLevel() {
  resetMaze();
  pacman = createPacman();
  ghosts = createGhosts();
  modeIndex = 0;
  modeTimer = 0;
  currentMode = 'scatter';
  frightTimer = 0;
  ghostEatCombo = 0;
  fruitActive = false;
  fruitTimer = 0;
  fruitSpawned = 0;
  particles.length = 0;
  scorePopups.length = 0;
  stopSiren();
  stopFrightSound();

  // Adjust dot limits per level
  if (level === 1) {
    ghosts[1].dotLimit = 0;
    ghosts[2].dotLimit = 30;
    ghosts[3].dotLimit = 60;
  } else if (level === 2) {
    ghosts[1].dotLimit = 0;
    ghosts[2].dotLimit = 0;
    ghosts[3].dotLimit = 50;
  } else {
    ghosts[1].dotLimit = 0;
    ghosts[2].dotLimit = 0;
    ghosts[3].dotLimit = 0;
  }
}

function resetAfterDeath() {
  pacman = createPacman();
  ghosts = createGhosts();
  modeIndex = 0;
  modeTimer = 0;
  currentMode = 'scatter';
  frightTimer = 0;
  ghostEatCombo = 0;
  stopSiren();
  stopFrightSound();

  ghosts[1].dotLimit = 0;
  ghosts[2].dotLimit = Math.max(0, ghosts[2].dotLimit - 10);
  ghosts[3].dotLimit = Math.max(0, ghosts[3].dotLimit - 10);
}

function resetToTitle() {
  gameState = 'title';
  stopSiren();
  stopFrightSound();
  document.getElementById('titleScreen').style.display = '';
  document.getElementById('gameOverScreen').classList.remove('active');
}

function togglePause() {
  if (gameState !== 'playing' && gameState !== 'ready') return;
  paused = !paused;
  if (paused) {
    document.getElementById('pauseOverlay').classList.add('active');
    stopSiren(); stopFrightSound();
  } else {
    document.getElementById('pauseOverlay').classList.remove('active');
  }
}

// ─── PARTICLE SYSTEM ────────────────────────────────────────
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed + speed * 0.3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 0.3 + Math.random() * 0.4,
      maxLife: 0.3 + Math.random() * 0.4,
      color,
      size: 2 + Math.random() * 3,
    });
  }
}

function spawnScorePopup(x, y, pts) {
  scorePopups.push({
    x, y, text: pts.toString(), life: 1.2, maxLife: 1.2
  });
}

// ─── MOVEMENT LOGIC ─────────────────────────────────────────
function getTileCenter(col, row) {
  return {x: col * TILE + TILE/2, y: row * TILE + TILE/2};
}

function pixelToTile(px, py) {
  return {col: Math.floor(px / TILE), row: Math.floor(py / TILE)};
}

function nearCenter(px, py, threshold) {
  const cx = Math.floor(px / TILE) * TILE + TILE / 2;
  const cy = Math.floor(py / TILE) * TILE + TILE / 2;
  return Math.abs(px - cx) <= threshold && Math.abs(py - cy) <= threshold;
}

function movePacman(dt) {
  if (pacman.eatPause > 0) { pacman.eatPause -= dt; return; }
  
  const spd = getSpeedForLevel(level);
  const mod = getDiffMod();
  let speedFactor = currentMode === 'frightened' ? spd.pacFright : spd.pac;
  speedFactor *= mod.pacSpeed;
  const speed = BASE_SPEED * speedFactor * dt;
  
  const px = pacman.x + TILE/2;
  const py = pacman.y + TILE/2;
  const col = Math.floor(px / TILE);
  const row = Math.floor(py / TILE);
  
  // Try next direction
  if (pacman.nextDir !== pacman.dir) {
    const nd = DIR[pacman.nextDir];
    const nc = wrapCol(col + nd.x);
    const nr = row + nd.y;
    if (!isWall(nc, nr) && !isGhostHouse(nc, nr)) {
      // Check alignment
      const centerX = col * TILE + TILE/2;
      const centerY = row * TILE + TILE/2;
      const threshold = speed + 2;
      if ((nd.x !== 0 && Math.abs(py - centerY) <= threshold) ||
          (nd.y !== 0 && Math.abs(px - centerX) <= threshold)) {
        pacman.dir = pacman.nextDir;
        // Snap to center on the perpendicular axis
        if (nd.x !== 0) pacman.y = row * TILE;
        if (nd.y !== 0) pacman.x = col * TILE;
      }
    }
  }
  
  const d = DIR[pacman.dir];
  const nc = wrapCol(col + d.x);
  const nr = row + d.y;
  
  // Check wall
  if (isWall(nc, nr) || isGhostHouse(nc, nr)) {
    // Snap to center if moving into wall
    const centerX = col * TILE;
    const centerY = row * TILE;
    if (d.x > 0 && pacman.x > centerX) { pacman.x = centerX; pacman.moving = false; return; }
    if (d.x < 0 && pacman.x < centerX) { pacman.x = centerX; pacman.moving = false; return; }
    if (d.y > 0 && pacman.y > centerY) { pacman.y = centerY; pacman.moving = false; return; }
    if (d.y < 0 && pacman.y < centerY) { pacman.y = centerY; pacman.moving = false; return; }
  }
  
  pacman.x += d.x * speed;
  pacman.y += d.y * speed;
  pacman.moving = true;
  
  // Tunnel wrap
  if (pacman.x < -TILE) pacman.x = COLS * TILE - TILE;
  else if (pacman.x > COLS * TILE) pacman.x = -TILE + 1;
  
  // Mouth animation
  if (pacman.moving) {
    pacman.mouthAngle += pacman.mouthSpeed * dt * (pacman.mouthOpen ? 1 : -1);
    if (pacman.mouthAngle > 0.85) { pacman.mouthAngle = 0.85; pacman.mouthOpen = false; }
    if (pacman.mouthAngle < 0.05) { pacman.mouthAngle = 0.05; pacman.mouthOpen = true; }
  }
  
  // Eat dots
  const eatCol = Math.floor((pacman.x + TILE/2) / TILE);
  const eatRow = Math.floor((pacman.y + TILE/2) / TILE);
  if (eatCol >= 0 && eatCol < COLS && eatRow >= 0 && eatRow < ROWS) {
    const tile = maze[eatRow][eatCol];
    if (tile === D) {
      maze[eatRow][eatCol] = E;
      score += 10;
      dotsEaten++;
      pacman.eatPause = 1/60; // 1 frame pause
      playWaka();
      spawnParticles(eatCol * TILE + TILE/2, eatRow * TILE + TILE/2, '#FFFFFF', 3, 40);
      checkFruit();
      checkExtraLife();
    } else if (tile === P) {
      maze[eatRow][eatCol] = E;
      score += 50;
      dotsEaten++;
      activateFrightened();
      playPowerEat();
      spawnParticles(eatCol * TILE + TILE/2, eatRow * TILE + TILE/2, '#FFB8FF', 8, 80);
      checkFruit();
      checkExtraLife();
    }
    
    // Check level complete
    if (dotsEaten >= totalDots) {
      gameState = 'levelComplete';
      stateTimer = 2.5;
      levelFlashTimer = 0;
      levelFlashCount = 0;
      stopSiren();
      stopFrightSound();
      playLevelComplete();
    }
    
    // Check fruit
    if (fruitActive) {
      const fruitCol = 14, fruitRow = 17;
      if (eatCol === fruitCol && eatRow === fruitRow) {
        const fi = Math.min(level - 1, FRUIT_TABLE.length - 1);
        const pts = FRUIT_TABLE[fi].pts;
        score += pts;
        fruitActive = false;
        playFruitEat();
        spawnScorePopup(fruitCol * TILE + TILE/2, fruitRow * TILE + TILE/2, pts);
        spawnParticles(fruitCol * TILE + TILE/2, fruitRow * TILE + TILE/2, FRUIT_TABLE[fi].color, 10, 80);
        checkExtraLife();
      }
    }
  }
}

function checkFruit() {
  if (fruitSpawned >= 2) return;
  if ((dotsEaten === 70 || dotsEaten === 170) && !fruitActive) {
    fruitActive = true;
    fruitTimer = 10;
    fruitSpawned++;
  }
}

function checkExtraLife() {
  if (!extraLifeGiven && score >= 10000) {
    lives++;
    extraLifeGiven = true;
    playExtraLife();
  }
}

function activateFrightened() {
  const mod = getDiffMod();
  let ft = getFrightTime(level) * mod.frightMult;
  if (ft <= 0) {
    // Just reverse ghosts, no frightened mode
    ghosts.forEach(g => {
      if (g.state === 'active' && !g.inHouse) g.dir = OPPOSITE[g.dir];
    });
    return;
  }
  frightTimer = ft;
  frightFlashing = false;
  ghostEatCombo = 0;
  currentMode = 'frightened';
  stopSiren();
  startFrightSound();
  ghosts.forEach(g => {
    if (g.state === 'active' && !g.inHouse) {
      g.mode = 'frightened';
      g.dir = OPPOSITE[g.dir];
    }
  });
}

// ─── GHOST AI ───────────────────────────────────────────────
function getGhostTarget(ghost, idx) {
  if (ghost.mode === 'frightened') return null; // random
  if (ghost.mode === 'scatter') return ghost.scatterTarget;
  
  // Chase mode targets
  const pc = Math.floor((pacman.x + TILE/2) / TILE);
  const pr = Math.floor((pacman.y + TILE/2) / TILE);
  const pd = DIR[pacman.dir];
  
  switch(idx) {
    case 0: // Blinky - target pacman directly
      return {col: pc, row: pr};
    case 1: { // Pinky - 4 tiles ahead
      let tc = pc + pd.x * 4;
      let tr = pr + pd.y * 4;
      // Original overflow bug when facing up
      if (pacman.dir === 'up') { tc -= 4; }
      return {col: tc, row: tr};
    }
    case 2: { // Inky - complex targeting using Blinky
      const ahead2c = pc + pd.x * 2;
      const ahead2r = pr + pd.y * 2 + (pacman.dir === 'up' ? 0 : 0);
      // Overflow bug for up
      let ac = ahead2c, ar = ahead2r;
      if (pacman.dir === 'up') ac -= 2;
      const blinky = ghosts[0];
      const bc = Math.floor((blinky.x + TILE/2) / TILE);
      const br = Math.floor((blinky.y + TILE/2) / TILE);
      return {col: ac + (ac - bc), row: ar + (ar - br)};
    }
    case 3: { // Clyde - if far, chase pacman; if close, scatter
      const gc = Math.floor((ghost.x + TILE/2) / TILE);
      const gr = Math.floor((ghost.y + TILE/2) / TILE);
      const dist = Math.sqrt((gc-pc)**2 + (gr-pr)**2);
      if (dist > 8) return {col: pc, row: pr};
      return ghost.scatterTarget;
    }
  }
}

function chooseGhostDir(ghost, idx) {
  const gc = Math.floor((ghost.x + TILE/2) / TILE);
  const gr = Math.floor((ghost.y + TILE/2) / TILE);
  const isEyes = ghost.state === 'eyes';
  
  // In ghost house, just move toward exit
  if (ghost.inHouse) return;
  
  if (ghost.mode === 'frightened' && !isEyes) {
    // Random direction at intersections
    const available = [];
    for (const dirName of DIR_ORDER) {
      if (dirName === OPPOSITE[ghost.dir]) continue;
      const d = DIR[dirName];
      const nc = wrapCol(gc + d.x);
      const nr = gr + d.y;
      if (canMove(nc, nr, true, isEyes)) available.push(dirName);
    }
    if (available.length > 0) {
      ghost.dir = available[Math.floor(Math.random() * available.length)];
    } else {
      ghost.dir = OPPOSITE[ghost.dir];
    }
    return;
  }
  
  const target = isEyes ? {col:14, row:11} : getGhostTarget(ghost, idx);
  if (!target) return;
  
  let bestDir = ghost.dir;
  let bestDist = Infinity;
  
  for (const dirName of DIR_ORDER) {
    if (dirName === OPPOSITE[ghost.dir]) continue;
    const d = DIR[dirName];
    const nc = wrapCol(gc + d.x);
    const nr = gr + d.y;
    
    // Ghosts can't move up at specific tiles (original restriction)
    if (dirName === 'up' && !isEyes) {
      if ((gr === 11 || gr === 23) && (gc === 12 || gc === 15)) continue;
    }
    
    if (canMove(nc, nr, true, isEyes)) {
      const dist = (nc - target.col)**2 + (nr - target.row)**2;
      if (dist < bestDist) {
        bestDist = dist;
        bestDir = dirName;
      }
    }
  }
  ghost.dir = bestDir;
}

function moveGhost(ghost, idx, dt) {
  const spd = getSpeedForLevel(level);
  const mod = getDiffMod();
  const isEyes = ghost.state === 'eyes';
  
  // Ghost house behavior
  if (ghost.inHouse) {
    // Check if ghost should leave
    if (dotsEaten >= ghost.dotLimit) {
      // Move toward door
      const doorX = 14 * TILE;
      const doorY = 11 * TILE;
      const speed = BASE_SPEED * 0.5 * dt;
      
      // First center horizontally
      if (Math.abs(ghost.x - doorX) > 2) {
        ghost.x += (ghost.x < doorX ? 1 : -1) * speed;
      } else {
        ghost.x = doorX;
        if (Math.abs(ghost.y - doorY) > 2) {
          ghost.y -= speed;
        } else {
          ghost.y = doorY;
          ghost.inHouse = false;
          ghost.dir = 'left';
          ghost.col = Math.floor(ghost.x / TILE);
          ghost.row = Math.floor(ghost.y / TILE);
        }
      }
    } else {
      // Bounce up and down
      ghost.houseTimer += dt * 3;
      ghost.y = ghost.startRow * TILE + Math.sin(ghost.houseTimer) * 4;
    }
    return;
  }
  
  // Speed calculation
  let speedFactor;
  if (isEyes) {
    speedFactor = 2.0; // eyes move fast
  } else if (ghost.mode === 'frightened') {
    speedFactor = spd.ghostFright;
  } else {
    const gc = Math.floor((ghost.x + TILE/2) / TILE);
    if (isTunnel(gc)) {
      speedFactor = spd.ghostTunnel;
    } else {
      speedFactor = spd.ghost;
      // Elroy speeds
      if (idx === 0) {
        const thresh = getElroyThresholds(level);
        const remaining = totalDots - dotsEaten;
        if (remaining <= thresh.elroy2 * mod.elroyMult) {
          speedFactor += 0.10;
          ghost.elroy = 2;
        } else if (remaining <= thresh.elroy1 * mod.elroyMult) {
          speedFactor += 0.05;
          ghost.elroy = 1;
        }
      }
    }
  }
  speedFactor *= mod.ghostSpeed;
  if (isEyes) speedFactor = 2.0; // override for eyes
  
  const speed = BASE_SPEED * speedFactor * dt;
  const d = DIR[ghost.dir];
  
  ghost.x += d.x * speed;
  ghost.y += d.y * speed;
  
  // Tunnel wrap
  if (ghost.x < -TILE) ghost.x = COLS * TILE;
  else if (ghost.x > COLS * TILE) ghost.x = -TILE;
  
  // Check if reached tile center -> make new decision
  const gc = Math.floor((ghost.x + TILE/2) / TILE);
  const gr = Math.floor((ghost.y + TILE/2) / TILE);
  const centerX = gc * TILE;
  const centerY = gr * TILE;
  
  if (gc !== ghost.col || gr !== ghost.row) {
    // Snap to center when entering a new tile
    ghost.x = centerX;
    ghost.y = centerY;
    ghost.col = gc;
    ghost.row = gr;
    
    // Eyes reaching house
    if (isEyes && gc === 14 && gr === 11) {
      ghost.state = 'active';
      ghost.inHouse = true;
      ghost.y = 14 * TILE;
      ghost.x = ghost.startCol * TILE;
      ghost.houseTimer = 0;
      ghost.dotLimit = 0; // leave immediately
      ghost.mode = currentMode === 'frightened' ? 'frightened' : currentMode;
      return;
    }
    
    chooseGhostDir(ghost, idx);
  }
}

// ─── COLLISION DETECTION ────────────────────────────────────
function checkCollisions() {
  const px = pacman.x + TILE/2;
  const py = pacman.y + TILE/2;
  
  for (let i = 0; i < ghosts.length; i++) {
    const g = ghosts[i];
    if (g.inHouse || g.state === 'eyes') continue;
    
    const gx = g.x + TILE/2;
    const gy = g.y + TILE/2;
    const dist = Math.sqrt((px-gx)**2 + (py-gy)**2);
    
    if (dist < TILE * 0.8) {
      if (g.mode === 'frightened') {
        // Eat ghost
        g.state = 'eyes';
        g.mode = 'eyes';
        ghostEatCombo++;
        const pts = 200 * Math.pow(2, ghostEatCombo - 1);
        score += pts;
        playGhostEat();
        spawnScorePopup(gx, gy, pts);
        spawnParticles(gx, gy, g.color, 12, 100);
        shakeTimer = 0.15;
        shakeIntensity = 4;
        checkExtraLife();
      } else {
        // Pac-Man dies
        gameState = 'dying';
        stateTimer = 1.8;
        pacman.deathFrame = 0;
        pacman.deathTimer = 0;
        stopSiren();
        stopFrightSound();
        playDeath();
      }
    }
  }
}

// ─── MODE MANAGEMENT ────────────────────────────────────────
function updateModes(dt) {
  if (currentMode === 'frightened') {
    frightTimer -= dt;
    const flashThreshold = Math.min(2, frightTimer);
    frightFlashing = frightTimer <= flashThreshold && frightTimer > 0;
    
    if (frightTimer <= 0) {
      currentMode = modeIndex % 2 === 0 ? 'scatter' : 'chase';
      stopFrightSound();
      startSiren();
      ghosts.forEach(g => {
        if (g.state === 'active' && !g.inHouse) {
          g.mode = currentMode;
        }
      });
    }
    return;
  }
  
  const timings = getModeTimings(level);
  modeTimer += dt;
  
  if (modeIndex < timings.length && modeTimer >= timings[modeIndex]) {
    modeTimer = 0;
    modeIndex++;
    currentMode = modeIndex % 2 === 0 ? 'scatter' : 'chase';
    // Reverse all ghosts
    ghosts.forEach(g => {
      if (g.state === 'active' && !g.inHouse) {
        g.dir = OPPOSITE[g.dir];
        g.mode = currentMode;
      }
    });
  }
}

// ─── UPDATE ─────────────────────────────────────────────────
function update(dt) {
  if (paused) return;
  
  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const s = scorePopups[i];
    s.y -= 40 * dt;
    s.life -= dt;
    if (s.life <= 0) scorePopups.splice(i, 1);
  }
  if (shakeTimer > 0) shakeTimer -= dt;
  
  // Fruit timer
  if (fruitActive) {
    fruitTimer -= dt;
    if (fruitTimer <= 0) fruitActive = false;
  }
  
  switch(gameState) {
    case 'ready':
      stateTimer -= dt;
      if (stateTimer <= 0) {
        gameState = 'playing';
        startSiren();
      }
      break;
      
    case 'playing':
      updateModes(dt);
      updateSiren();
      movePacman(dt);
      ghosts.forEach((g, i) => moveGhost(g, i, dt));
      checkCollisions();
      break;
      
    case 'dying':
      stateTimer -= dt;
      pacman.deathTimer += dt;
      if (stateTimer <= 0) {
        lives--;
        if (lives <= 0) {
          gameState = 'gameOver';
          if (score > highScore) highScore = score;
          document.getElementById('goScore').textContent = 'SCORE: ' + score;
          document.getElementById('goHigh').textContent = 'HIGH SCORE: ' + highScore;
          document.getElementById('gameOverScreen').classList.add('active');
        } else {
          resetAfterDeath();
          gameState = 'ready';
          stateTimer = 2;
        }
      }
      break;
      
    case 'levelComplete':
      stateTimer -= dt;
      levelFlashTimer += dt;
      if (stateTimer <= 0) {
        level++;
        resetLevel();
        gameState = 'ready';
        stateTimer = 2;
      }
      break;
  }
}

// ─── RENDERING ──────────────────────────────────────────────
// Pre-render maze walls to offscreen canvas for performance
let mazeCanvas = null;
let mazeNeedsRedraw = true;

function buildMazeCanvas() {
  mazeCanvas = document.createElement('canvas');
  mazeCanvas.width = COLS * TILE;
  mazeCanvas.height = ROWS * TILE;
  const mc = mazeCanvas.getContext('2d');
  drawMazeWalls(mc);
  mazeNeedsRedraw = false;
}

function isNonWall(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
  return maze[r][c] !== W;
}

function drawMazeWalls(mc) {
  mc.clearRect(0, 0, COLS * TILE, ROWS * TILE);
  
  // First pass: subtle wall fill for depth
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (maze[r][c] !== W) continue;
      const x = c * TILE;
      const y = r * TILE;
      mc.fillStyle = 'rgba(0,20,60,0.35)';
      mc.fillRect(x, y, TILE, TILE);
    }
  }
  
  // Draw ghost door
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (maze[r][c] !== GD) continue;
      const x = c * TILE;
      const y = r * TILE;
      mc.fillStyle = '#FFB8FF';
      mc.shadowBlur = 10;
      mc.shadowColor = '#FFB8FF';
      mc.fillRect(x, y + TILE/2 - 2, TILE, 4);
      mc.shadowBlur = 0;
    }
  }
  
  // Build connected wall edge segments for smoother neon lines
  // Horizontal edges
  mc.strokeStyle = '#1a7aff';
  mc.lineWidth = 2.5;
  mc.shadowBlur = 14;
  mc.shadowColor = '#0066ff';
  mc.lineCap = 'round';
  
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (maze[r][c] !== W) continue;
      const x = c * TILE;
      const y = r * TILE;
      
      // Top edge: wall tile with non-wall above (or top border)
      if (isNonWall(r-1, c)) {
        mc.beginPath(); mc.moveTo(x, y+1.5); mc.lineTo(x+TILE, y+1.5); mc.stroke();
      }
      // Bottom edge
      if (isNonWall(r+1, c)) {
        mc.beginPath(); mc.moveTo(x, y+TILE-1.5); mc.lineTo(x+TILE, y+TILE-1.5); mc.stroke();
      }
      // Left edge
      if (isNonWall(r, c-1)) {
        mc.beginPath(); mc.moveTo(x+1.5, y); mc.lineTo(x+1.5, y+TILE); mc.stroke();
      }
      // Right edge
      if (isNonWall(r, c+1)) {
        mc.beginPath(); mc.moveTo(x+TILE-1.5, y); mc.lineTo(x+TILE-1.5, y+TILE); mc.stroke();
      }
    }
  }
  
  // Second glow pass (wider, dimmer) for bloom effect
  mc.strokeStyle = 'rgba(0,102,255,0.3)';
  mc.lineWidth = 6;
  mc.shadowBlur = 20;
  mc.shadowColor = '#0044cc';
  
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (maze[r][c] !== W) continue;
      const x = c * TILE;
      const y = r * TILE;
      
      if (isNonWall(r-1, c)) {
        mc.beginPath(); mc.moveTo(x, y+1.5); mc.lineTo(x+TILE, y+1.5); mc.stroke();
      }
      if (isNonWall(r+1, c)) {
        mc.beginPath(); mc.moveTo(x, y+TILE-1.5); mc.lineTo(x+TILE, y+TILE-1.5); mc.stroke();
      }
      if (isNonWall(r, c-1)) {
        mc.beginPath(); mc.moveTo(x+1.5, y); mc.lineTo(x+1.5, y+TILE); mc.stroke();
      }
      if (isNonWall(r, c+1)) {
        mc.beginPath(); mc.moveTo(x+TILE-1.5, y); mc.lineTo(x+TILE-1.5, y+TILE); mc.stroke();
      }
    }
  }
  mc.shadowBlur = 0;
}

function render() {
  // Resize canvas
  const scale = Math.min(
    window.innerWidth / CANVAS_W,
    window.innerHeight / CANVAS_H
  );
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;
  canvas.style.width = (CANVAS_W * scale) + 'px';
  canvas.style.height = (CANVAS_H * scale) + 'px';
  
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  
  if (gameState === 'title') return;
  
  // Screen shake
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeIntensity,
      (Math.random() - 0.5) * shakeIntensity
    );
  }
  
  ctx.save();
  ctx.translate(0, MAZE_OFFSET_Y);
  
  // Level complete flash
  if (gameState === 'levelComplete') {
    const flash = Math.floor(levelFlashTimer * 6) % 2;
    if (flash) {
      // White maze
      drawMazeFlash('#FFFFFF');
    } else {
      drawMazeFlash('#0066ff');
    }
    drawPacmanSprite();
    ctx.restore();
    drawHUD();
    ctx.restore();
    return;
  }
  
  // Draw maze
  if (mazeNeedsRedraw) buildMazeCanvas();
  ctx.drawImage(mazeCanvas, 0, 0);
  
  // Draw dots & power pellets
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * TILE + TILE/2;
      const y = r * TILE + TILE/2;
      if (maze[r][c] === D) {
        ctx.fillStyle = '#FFF0DD';
        ctx.shadowBlur = 6;
        ctx.shadowColor = 'rgba(255,240,200,0.7)';
        ctx.beginPath();
        ctx.arc(x, y, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      } else if (maze[r][c] === P) {
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 180);
        const sz = 5.5 * pulse;
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowBlur = 20 * pulse;
        ctx.shadowColor = '#FFE4C9';
        ctx.beginPath();
        ctx.arc(x, y, sz, 0, Math.PI * 2);
        ctx.fill();
        // Inner bright core
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(x, y, sz * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  
  // Draw fruit
  if (fruitActive) {
    const fi = Math.min(level - 1, FRUIT_TABLE.length - 1);
    const fx = 14 * TILE + TILE/2;
    const fy = 17 * TILE + TILE/2;
    drawFruit(ctx, fx, fy, FRUIT_TABLE[fi]);
  }
  
  // Draw ghosts
  if (gameState !== 'dying') {
    ghosts.forEach((g, i) => drawGhost(g, i));
  }
  
  // Draw Pac-Man
  if (gameState === 'dying') {
    drawPacmanDeath();
  } else {
    drawPacmanSprite();
    // Particle trail
    if (pacman.moving && gameState === 'playing') {
      const d = DIR[pacman.dir];
      const tx = pacman.x + TILE/2 - d.x * 6;
      const ty = pacman.y + TILE/2 - d.y * 6;
      if (Math.random() < 0.4) {
        spawnParticles(tx, ty, 'rgba(255,224,0,0.6)', 1, 20);
      }
    }
  }
  
  // Draw particles
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 4;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });
  
  // Score popups
  scorePopups.forEach(s => {
    const alpha = s.life / s.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = "bold 10px 'Press Start 2P', monospace";
    ctx.textAlign = 'center';
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#FFE000';
    ctx.fillText(s.text, s.x, s.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });
  
  ctx.restore(); // maze offset
  
  // CRT scanline overlay (subtle)
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let y = 0; y < CANVAS_H; y += 3) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, y, CANVAS_W, 1);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  
  // Vignette effect
  const vgrd = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.35, CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.7);
  vgrd.addColorStop(0, 'rgba(0,0,0,0)');
  vgrd.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vgrd;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  
  // Draw HUD
  drawHUD();
  
  // Ready text
  if (gameState === 'ready') {
    ctx.save();
    ctx.translate(0, MAZE_OFFSET_Y);
    ctx.fillStyle = '#FFE000';
    ctx.font = "14px 'Press Start 2P', monospace";
    ctx.textAlign = 'center';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#FFE000';
    ctx.fillText('READY!', COLS * TILE / 2, 17 * TILE + TILE/2 + 5);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  
  ctx.restore(); // shake
}

function isTemplateNonWall(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
  return MAZE_TEMPLATE[r][c] !== W;
}

function drawMazeFlash(color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = color === '#FFFFFF' ? 18 : 14;
  ctx.shadowColor = color;
  ctx.lineCap = 'round';
  
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAZE_TEMPLATE[r][c] !== W) continue;
      const x = c * TILE;
      const y = r * TILE;
      
      if (isTemplateNonWall(r-1, c)) { ctx.beginPath(); ctx.moveTo(x, y+1.5); ctx.lineTo(x+TILE, y+1.5); ctx.stroke(); }
      if (isTemplateNonWall(r+1, c)) { ctx.beginPath(); ctx.moveTo(x, y+TILE-1.5); ctx.lineTo(x+TILE, y+TILE-1.5); ctx.stroke(); }
      if (isTemplateNonWall(r, c-1)) { ctx.beginPath(); ctx.moveTo(x+1.5, y); ctx.lineTo(x+1.5, y+TILE); ctx.stroke(); }
      if (isTemplateNonWall(r, c+1)) { ctx.beginPath(); ctx.moveTo(x+TILE-1.5, y); ctx.lineTo(x+TILE-1.5, y+TILE); ctx.stroke(); }
    }
  }
  ctx.shadowBlur = 0;
}

function drawPacmanSprite() {
  const cx = pacman.x + TILE/2;
  const cy = pacman.y + TILE/2;
  const r = TILE/2 - 1;
  
  let angle = 0;
  if (pacman.dir === 'right') angle = 0;
  else if (pacman.dir === 'down') angle = Math.PI/2;
  else if (pacman.dir === 'left') angle = Math.PI;
  else if (pacman.dir === 'up') angle = -Math.PI/2;
  
  const mouth = pacman.mouthAngle * 0.8;
  
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  
  ctx.fillStyle = '#FFE000';
  ctx.shadowBlur = 12;
  ctx.shadowColor = 'rgba(255,224,0,0.7)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, r, mouth, Math.PI * 2 - mouth);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  
  ctx.restore();
}

function drawPacmanDeath() {
  const cx = pacman.x + TILE/2;
  const cy = pacman.y + TILE/2;
  const r = TILE/2 - 1;
  const progress = Math.min(1, pacman.deathTimer / 1.5);
  
  const startAngle = Math.PI/2 * progress * 2;
  const endAngle = Math.PI * 2 - startAngle;
  
  if (progress < 1) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle = '#FFE000';
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(255,224,0,0.7)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r * (1 - progress * 0.3), startAngle, endAngle);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function drawGhost(ghost, idx) {
  const cx = ghost.x + TILE/2;
  const cy = ghost.y + TILE/2;
  const r = TILE/2;
  const isEyes = ghost.state === 'eyes';
  
  if (!isEyes) {
    let bodyColor;
    if (ghost.mode === 'frightened') {
      if (frightFlashing && Math.floor(performance.now() / 150) % 2) {
        bodyColor = '#FFFFFF';
      } else {
        bodyColor = '#2121FF';
      }
    } else {
      bodyColor = ghost.color;
    }
    
    // Ghost body with glow
    ctx.fillStyle = bodyColor;
    ctx.shadowBlur = 12;
    ctx.shadowColor = bodyColor;
    ctx.beginPath();
    ctx.arc(cx, cy - 1, r - 1, Math.PI, 0);
    // Wavy bottom with animation
    const wave = performance.now() / 120;
    const bx = cx + r - 1;
    const by = cy + r - 2;
    const numTeeth = 4;
    const tw = (r * 2 - 2) / numTeeth;
    ctx.lineTo(bx, by);
    for (let i = 0; i < numTeeth; i++) {
      const tx = bx - i * tw;
      const peakY = by + 3 * Math.sin(wave + i * 1.2);
      ctx.lineTo(tx - tw/2, peakY);
      ctx.lineTo(tx - tw, by - 1);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // Eyes (always drawn, with glow for eyes-only state)
  if (ghost.mode !== 'frightened' || isEyes) {
    const eyeR = 3.2;
    const pupilR = 1.8;
    const d = DIR[ghost.dir];
    const eyeOffY = -2;
    
    if (isEyes) {
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#FFFFFF';
    }
    
    // White of eye
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.ellipse(cx - 3.5, cy + eyeOffY, eyeR, eyeR + 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 3.5, cy + eyeOffY, eyeR, eyeR + 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupils (deep blue)
    ctx.fillStyle = '#2121DE';
    ctx.beginPath();
    ctx.arc(cx - 3.5 + d.x * 2, cy + eyeOffY + d.y * 2, pupilR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + 3.5 + d.x * 2, cy + eyeOffY + d.y * 2, pupilR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    // Frightened face
    const isFlash = frightFlashing && Math.floor(performance.now() / 150) % 2;
    ctx.fillStyle = isFlash ? '#FF0000' : '#FFB8FF';
    // Squiggly eyes
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 2.5, 1.8, 0, Math.PI * 2);
    ctx.arc(cx + 3, cy - 2.5, 1.8, 0, Math.PI * 2);
    ctx.fill();
    // Wavy mouth
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy + 3);
    for (let i = 0; i < 5; i++) {
      const my = (i % 2 === 0) ? cy + 4 : cy + 1.5;
      ctx.lineTo(cx - 5 + (i + 0.5) * 2, my);
    }
    ctx.stroke();
  }
}

function drawFruit(c, x, y, fruit) {
  const pulse = 0.9 + 0.1 * Math.sin(performance.now() / 300);
  c.fillStyle = fruit.color;
  c.shadowBlur = 10;
  c.shadowColor = fruit.color;
  c.beginPath();
  c.arc(x, y, 6 * pulse, 0, Math.PI * 2);
  c.fill();
  // Stem
  c.fillStyle = '#00AA00';
  c.fillRect(x - 1, y - 8, 2, 4);
  c.shadowBlur = 0;
}

function drawHUD() {
  // Score - top left
  ctx.fillStyle = '#FFFFFF';
  ctx.font = "10px 'Press Start 2P', monospace";
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 8, 16);
  ctx.fillStyle = '#FFE000';
  ctx.font = "12px 'Press Start 2P', monospace";
  ctx.fillText(score.toString().padStart(6, ' '), 8, 32);
  
  // High score - top center
  ctx.fillStyle = '#FFFFFF';
  ctx.font = "10px 'Press Start 2P', monospace";
  ctx.textAlign = 'center';
  ctx.fillText('HIGH SCORE', CANVAS_W / 2, 16);
  ctx.fillStyle = '#00FFFF';
  ctx.font = "12px 'Press Start 2P', monospace";
  ctx.fillText(highScore.toString().padStart(6, ' '), CANVAS_W / 2, 32);
  
  // Level - top right
  ctx.fillStyle = '#FFFFFF';
  ctx.font = "10px 'Press Start 2P', monospace";
  ctx.textAlign = 'right';
  ctx.fillText('LV ' + level, CANVAS_W - 8, 16);
  
  // Lives - bottom left
  const lifeY = CANVAS_H - HUD_BOTTOM + 16;
  for (let i = 0; i < lives - 1; i++) {
    const lx = 16 + i * 22;
    ctx.fillStyle = '#FFE000';
    ctx.beginPath();
    ctx.arc(lx, lifeY, 7, 0.2 * Math.PI, 1.8 * Math.PI);
    ctx.lineTo(lx, lifeY);
    ctx.closePath();
    ctx.fill();
  }
  
  // Level indicator (fruit icons) - bottom right
  const fi = Math.min(level - 1, FRUIT_TABLE.length - 1);
  for (let i = Math.max(0, fi - 3); i <= fi; i++) {
    const fx = CANVAS_W - 16 - (fi - i) * 22;
    ctx.fillStyle = FRUIT_TABLE[i].color;
    ctx.beginPath();
    ctx.arc(fx, lifeY, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Difficulty indicator
  ctx.fillStyle = '#8888a0';
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = 'center';
  ctx.fillText(difficulty.toUpperCase(), CANVAS_W / 2, lifeY + 4);
}

// ─── GAME LOOP ──────────────────────────────────────────────
const TICK_RATE = 1000 / 60;
let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);
  
  if (lastTime === 0) { lastTime = timestamp; return; }
  const deltaTime = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;
  
  if (gameState === 'title' || gameState === 'gameOver') {
    render();
    return;
  }
  
  accumulator += deltaTime;
  while (accumulator >= TICK_RATE) {
    update(TICK_RATE / 1000);
    accumulator -= TICK_RATE;
  }
  
  render();
}

// ─── INIT ───────────────────────────────────────────────────
function init() {
  resetMaze();
  pacman = createPacman();
  ghosts = createGhosts();
  
  // Initial render
  render();
  
  // Start loop
  requestAnimationFrame(gameLoop);
}

// Wait for fonts
document.fonts.ready.then(init);
</script>

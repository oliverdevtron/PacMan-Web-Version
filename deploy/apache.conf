<VirtualHost *:80>
    # PAC-MAN Arcade Edition - Apache Configuration
    # ================================================
    # 
    # Installation:
    #   sudo cp apache.conf /etc/apache2/sites-available/pacman.conf
    #   sudo a2ensite pacman
    #   sudo a2enmod headers rewrite expires deflate
    #   sudo systemctl reload apache2
    #
    # Für eine eigene Domain, ersetze ServerName entsprechend.
    # Für SSL/HTTPS: sudo certbot --apache -d pacman.deine-domain.de

    # ServerName pacman.example.com
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/pacman

    <Directory /var/www/pacman>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Kompression ──────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # ── Caching ──────────────────────────────────────
    <IfModule mod_expires.c>
        ExpiresActive On
        
        # HTML: 1 Stunde (für Updates)
        ExpiresByType text/html "access plus 1 hour"
        
        # Bilder: 30 Tage
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/gif "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType image/x-icon "access plus 30 days"
        
        # Fonts: 1 Jahr
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType application/font-woff2 "access plus 1 year"
    </IfModule>

    # ── Security Headers ─────────────────────────────
    <IfModule mod_headers.c>
        # Clickjacking-Schutz
        Header always set X-Frame-Options "SAMEORIGIN"
        
        # MIME-Type Sniffing verhindern
        Header always set X-Content-Type-Options "nosniff"
        
        # XSS-Schutz
        Header always set X-XSS-Protection "1; mode=block"
        
        # Referrer Policy
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        
        # Content Security Policy (erlaubt Google Fonts CDN)
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"
        
        # Cache-Control für HTML
        <FilesMatch "\.(html)$">
            Header set Cache-Control "public, max-age=3600, must-revalidate"
        </FilesMatch>
        
        # Cache-Control für Assets
        <FilesMatch "\.(png|jpg|jpeg|gif|svg|ico)$">
            Header set Cache-Control "public, max-age=2592000, immutable"
        </FilesMatch>
    </IfModule>

    # ── Logging ──────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/pacman-error.log
    CustomLog ${APACHE_LOG_DIR}/pacman-access.log combined

</VirtualHost>
